<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RHI — Trade lanes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
html,body{margin:0;height:100%;background:#ECEAE4;overflow:hidden;font-family:'Manrope',sans-serif}
a{color:#2A78B3}a:hover{color:#0E121B}
#map{position:absolute;inset:0}
svg{display:block;width:100%;height:100%}
.lbl{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;fill:#0E121B;paint-order:stroke;stroke:#ECEAE4;stroke-width:4px;stroke-linejoin:round}
.lbl.hq{font-weight:500;fill:#2A78B3}
.note{position:absolute;right:14px;bottom:10px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#5A6070}
.legend{position:absolute;left:14px;bottom:10px;display:flex;gap:16px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#5A6070;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;display:inline-block}
@keyframes ping{0%{r:5;opacity:.9}100%{r:22;opacity:0}}
.ping{animation:ping 2.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){.ping{animation:none;opacity:0}}
</style>
</head>
<body>
<div id="map"></div>
<div class="legend"><span><i class="sw" style="background:#BFDDF2"></i>Markets served</span><span><i class="sw" style="background:#3F97D3;border-radius:50%"></i>Hub</span></div>
<div class="note">Illustrative trade lanes · Natural Earth</div>
<script>
const HUBS = [
  { id: 'mt', label: 'Malta · HQ', ll: [14.51, 35.9], hq: true, dx: 0, dy: -16, anchor: 'middle' },
  { id: 'ae', label: 'Dubai · Cem Asia', ll: [55.27, 25.2], dx: 10, dy: 22, anchor: 'start' },
  { id: 'fe', label: 'Far East', ll: [114.17, 22.3], dx: 0, dy: -16, anchor: 'middle' },
  { id: 'sea', label: 'South-East Asia', ll: [106.8, 10.8], dx: 0, dy: 22, anchor: 'middle' },
  { id: 'ea', label: 'East Africa', ll: [39.67, -4.04], dx: 12, dy: 4, anchor: 'start' },
  { id: 'wa', label: 'West Africa', ll: [3.38, 6.45], dx: -10, dy: 22, anchor: 'end' },
  { id: 'sa', label: 'South Asia', ll: [72.88, 19.07], dx: 0, dy: 22, anchor: 'middle' }
];
const LANES = [['ae','fe'],['ae','sea'],['ae','ea'],['ae','sa'],['ae','wa'],['mt','ae'],['mt','wa'],['sea','ea']];
// ISO numeric codes of markets highlighted (illustrative: Far East, Middle East, Africa)
const MARKETS = new Set(['784','682','512','634','414','048','364','156','704','360','458','764','608','410','050','356','144','586','404','834','231','706','566','288','384','686','24','430','694','012','818','504','470']);
const pad3 = s => String(s).padStart(3,'0');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let world;
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r => r.json()).then(t => { world = topojson.feature(t, t.objects.countries); draw(); addEventListener('resize', draw); });
function draw() {
  const el = document.getElementById('map'), W = el.clientWidth, H = el.clientHeight;
  el.innerHTML = '';
  const proj = d3.geoMercator().fitExtent([[24, 24], [W - 24, H - 40]], { type: 'MultiPoint', coordinates: [[-18, 40], [124, 40], [-18, -12], [124, -12]] });
  const path = d3.geoPath(proj);
  const svg = d3.select(el).append('svg').attr('viewBox', `0 0 ${W} ${H}`);
  const grat = d3.geoGraticule().step([15, 15]);
  svg.append('path').attr('d', path(grat())).attr('fill', 'none').attr('stroke', '#DCD9D1').attr('stroke-width', .6);
  svg.append('g').selectAll('path').data(world.features).join('path')
    .attr('d', path)
    .attr('fill', d => MARKETS.has(pad3(d.id)) ? '#BFDDF2' : '#D9D6CE')
    .attr('stroke', '#ECEAE4').attr('stroke-width', .7);
  const byId = Object.fromEntries(HUBS.map(h => [h.id, h]));
  const lanes = svg.append('g');
  const shipG = svg.append('g');
  const paths = LANES.map(([a, b]) => {
    const p0 = proj(byId[a].ll), p1 = proj(byId[b].ll);
    const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2, dx = p1[0] - p0[0], dy = p1[1] - p0[1], len = Math.hypot(dx, dy);
    const k = .18 * len, cx = mx - dy / len * k, cy = my + dx / len * k;
    return lanes.append('path').attr('d', `M${p0[0]},${p0[1]} Q${cx},${cy} ${p1[0]},${p1[1]}`)
      .attr('fill', 'none').attr('stroke', '#2A78B3').attr('stroke-width', 1.4).attr('stroke-dasharray', '4 6').node();
  });
  const ships = paths.map(() => { const g = shipG.append('g'); g.append('circle').attr('r', 8).attr('fill', 'rgba(63,151,211,.28)'); g.append('circle').attr('r', 3.5).attr('fill', '#0E121B'); return g.node(); });
  const hubs = svg.append('g').selectAll('g').data(HUBS).join('g').attr('transform', d => `translate(${proj(d.ll)})`);
  hubs.append('circle').attr('class', 'ping').attr('r', 5).attr('fill', '#3F97D3');
  hubs.append('circle').attr('r', d => d.hq ? 7 : 5).attr('fill', d => d.hq ? '#3F97D3' : '#0E121B').attr('stroke', '#fff').attr('stroke-width', 2);
  hubs.append('text').attr('class', d => 'lbl' + (d.hq ? ' hq' : '')).attr('x', d => d.dx).attr('y', d => d.dy).attr('text-anchor', d => d.anchor).text(d => d.label);
  if (reduced) { paths.forEach((p, i) => { const pt = p.getPointAtLength(p.getTotalLength() / 2); ships[i].setAttribute('transform', `translate(${pt.x},${pt.y})`); }); return; }
  const L = paths.map(p => p.getTotalLength()), t0 = performance.now();
  cancelAnimationFrame(window.__raf);
  const tick = now => {
    const t = (now - t0) / 1000;
    paths.forEach((p, i) => {
      p.style.strokeDashoffset = -(t * 18) % 10;
      const raw = t * .07 + i * .19, u = raw % 1, back = Math.floor(raw) % 2 === 1, e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      const pt = p.getPointAtLength(L[i] * (back ? 1 - e : e)); ships[i].setAttribute('transform', `translate(${pt.x},${pt.y})`);
    });
    window.__raf = requestAnimationFrame(tick);
  };
  window.__raf = requestAnimationFrame(tick);
}
</script>
</body>
</html>
